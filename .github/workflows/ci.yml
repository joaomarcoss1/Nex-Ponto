name: NexPonto v5.3 quality gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
      TENANT_CONTEXT_SECRET: ci-tenant-context-secret-at-least-32-characters
      EMPLOYEE_SESSION_SECRET: ci-employee-session-secret-at-least-32-characters
      AUDIT_HASH_SALT: ci-audit-hash-salt-at-least-32-characters
      RATE_LIMIT_HASH_SALT: ci-rate-limit-hash-salt-at-least-32-characters
      INTERNAL_JOBS_SECRET: ci-internal-jobs-secret-at-least-32-characters
      DEVICE_IDENTITY_SECRET: ci-device-identity-secret-at-least-32-characters
      RECEIPT_TOKEN_SECRET: ci-receipt-token-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      FEATURE_OFFICIAL_PAYROLL: "false"
      MFA_ENFORCEMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:data
      - run: npm run migrations:check
      - run: npm run structure:check
      - run: npm run structure:v51
      - run: npm run structure:v53
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run audit
      - run: npm run build

  e2e-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
      TENANT_CONTEXT_SECRET: ci-tenant-context-secret-at-least-32-characters
      EMPLOYEE_SESSION_SECRET: ci-employee-session-secret-at-least-32-characters
      AUDIT_HASH_SALT: ci-audit-hash-salt-at-least-32-characters
      RATE_LIMIT_HASH_SALT: ci-rate-limit-hash-salt-at-least-32-characters
      INTERNAL_JOBS_SECRET: ci-internal-jobs-secret-at-least-32-characters
      DEVICE_IDENTITY_SECRET: ci-device-identity-secret-at-least-32-characters
      RECEIPT_TOKEN_SECRET: ci-receipt-token-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      FEATURE_OFFICIAL_PAYROLL: "false"
      MFA_ENFORCEMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
